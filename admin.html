// تعديل وظيفة loadTables داخل ملف admin.html

allDBProperties.forEach(prop => {
    let coverImg = (Array.isArray(prop.images) && prop.images.length > 0) ? prop.images[0] : 'logo.jpg';
    tbody.innerHTML += `<tr>
        <td><img src="${coverImg}" width="50" height="50" style="object-fit:cover;"></td>
        <td>${prop.title}</td>
        <td class="text-primary fw-bold"><i class="fas fa-eye"></i> ${prop.views || 0}</td>
        <td>${prop.city}</td>
        <td>
            <button class="btn btn-warning btn-sm" onclick="editProp(${prop.id})">تعديل</button>
            <button class="btn btn-danger btn-sm" onclick="deleteProp(${prop.id})">حذف</button>
        </td>
    </tr>`;
});
