<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل العقار</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8f9fa; }
        .details-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-top: 30px; margin-bottom: 50px;}
        .carousel-item img { height: 500px; object-fit: cover; border-radius: 10px; }
        .price-badge { background: #0d6efd; color: white; padding: 10px 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; }
        .info-box { background: #f4f6f9; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-right: 4px solid #0d6efd; }
        .commission-box { background-color: #fff3cd; color: #856404; padding: 15px; border-radius: 10px; font-weight: bold; border-right: 4px solid #ffc107; }
        
        @media print {
            body { background: white; margin: 0; padding: 0; }
            .no-print { display: none !important; }
            .details-container { box-shadow: none; margin-top: 0; }
            .carousel-control-prev, .carousel-control-next, .carousel-indicators { display: none !important; }
            .carousel-item img { height: 400px; page-break-inside: avoid; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark no-print">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fas fa-home me-2"></i> بوابة العقار</a>
            <button onclick="window.print()" class="btn btn-light btn-sm fw-bold"><i class="fas fa-print me-1"></i> طباعة الإعلان</button>
        </div>
    </nav>

    <div class="container">
        <div class="details-container" id="propertyDetails">
            <div class="text-center py-5">جاري تحميل البيانات...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const propId = urlParams.get('id');

            if (!propId) {
                document.getElementById('propertyDetails').innerHTML = '<div class="alert alert-danger text-center">عذراً، لم يتم العثور على العقار!</div>';
                return;
            }

            const properties = JSON.parse(localStorage.getItem('myProperties')) || [];
            const prop = properties.find(p => p.id === Number(propId));

            if (!prop) {
                document.getElementById('propertyDetails').innerHTML = '<div class="alert alert-danger text-center">عذراً، هذا العقار غير موجود أو تم حذفه!</div>';
                return;
            }

            let imagesArray = Array.isArray(prop.images) ? prop.images : (prop.image ? [prop.image] : []);
            let indicatorsHTML = '';
            let innerHTML = '';
            
            imagesArray.forEach((imgSrc, index) => {
                let activeClass = index === 0 ? 'active' : '';
                indicatorsHTML += `<button type="button" data-bs-target="#propertyCarousel" data-bs-slide-to="${index}" class="${activeClass}"></button>`;
                innerHTML += `
                    <div class="carousel-item ${activeClass}">
                        <img src="${imgSrc}" class="d-block w-100" alt="صورة العقار">
                    </div>
                `;
            });

            const typeText = prop.type === 'sale' ? 'للبيع' : 'للإيجار';
            const categoryMap = { 'villa': 'فيلا', 'apartment': 'شقة', 'land': 'أرض' };
            const categoryText = categoryMap[prop.category] || prop.category;
            const commissionValue = (Number(prop.price) * 0.025).toLocaleString();

            const detailsHTML = `
                <div class="row">
                    <div class="col-lg-8">
                        <div id="propertyCarousel" class="carousel slide mb-4" data-bs-ride="carousel">
                            <div class="carousel-indicators">
                                ${indicatorsHTML}
                            </div>
                            <div class="carousel-inner">
                                ${innerHTML}
                            </div>
                            ${imagesArray.length > 1 ? `
                            <button class="carousel-control-prev" type="button" data-bs-target="#propertyCarousel" data-bs-slide="prev">
                                <span class="carousel-control-prev-icon"></span>
                            </button>
                            <button class="carousel-control-next" type="button" data-bs-target="#propertyCarousel" data-bs-slide="next">
                                <span class="carousel-control-next-icon"></span>
                            </button>` : ''}
                        </div>

                        <h2 class="fw-bold mb-3">${prop.title}</h2>
                        <p class="text-muted fs-5"><i class="fas fa-map-marker-alt text-danger me-2"></i> ${prop.city} - حي ${prop.district}</p>
                        
                        <h4 class="fw-bold mt-4 border-bottom pb-2">التفاصيل والوصف</h4>
                        <p class="fs-5" style="white-space: pre-wrap; line-height: 1.8;">${prop.description}</p>
                    </div>

                    <div class="col-lg-4">
                        <div class="sticky-top" style="top: 20px;">
                            <div class="text-center mb-4">
                                <div class="price-badge d-inline-block w-100">${Number(prop.price).toLocaleString()} ريال سعودي</div>
                            </div>
                            
                            <div class="info-box">
                                <strong><i class="fas fa-home text-primary me-2"></i> نوع العقار:</strong> ${categoryText}
                            </div>
                            <div class="info-box">
                                <strong><i class="fas fa-tags text-primary me-2"></i> العرض:</strong> ${typeText}
                            </div>
                            <div class="info-box border-success">
                                <strong><i class="fas fa-hashtag text-success me-2"></i> رقم الإعلان:</strong> ${prop.id}
                            </div>

                            <div class="commission-box my-3">
                                <i class="fas fa-hand-holding-usd me-2"></i> عمولة السعي (2.5%): ${commissionValue} ر.س
                            </div>

                            <a href="https://wa.me/966500000000?text=السلام عليكم، أستفسر عن الإعلان رقم: ${prop.id}%0Aالعنوان: ${prop.title}" class="btn btn-success w-100 btn-lg fw-bold no-print mt-3">
                                <i class="fab fa-whatsapp me-2"></i> تواصل عبر الواتساب
                            </a>
                            <button onclick="window.history.back()" class="btn btn-outline-secondary w-100 mt-2 fw-bold no-print">
                                <i class="fas fa-arrow-right me-2"></i> العودة للرئيسية
                            </button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('propertyDetails').innerHTML = detailsHTML;
        });
    </script>
</body>
</html>
