<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل العقار</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8f9fa; }
        .details-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-top: 30px; margin-bottom: 50px;}
        .carousel-item img { height: 500px; object-fit: cover; border-radius: 10px; }
        .price-badge { background: #0d6efd; color: white; padding: 10px 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; }
        .info-box { background: #f4f6f9; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-right: 4px solid #0d6efd; }
        .commission-box { background-color: #fff3cd; color: #856404; padding: 15px; border-radius: 10px; font-weight: bold; border-right: 4px solid #ffc107; }
        
        /* ألوان الهوية البصرية المطابقة للشعار */
        .bg-dark { background-color: #1a1a1a !important; }
        .btn-primary, .bg-primary { background-color: #B68D40 !important; border-color: #B68D40 !important; color: #fff !important; }
        .btn-primary:hover { background-color: #9A7532 !important; border-color: #9A7532 !important; }
        .text-primary { color: #B68D40 !important; }
        .border-primary { border-color: #B68D40 !important; }
        .price-badge { background: #B68D40; color: white; }
        .info-box { border-right: 4px solid #B68D40; }

        @media print {
            body { background: white; margin: 0; padding: 0; }
            .no-print { display: none !important; }
            .details-container { box-shadow: none; margin-top: 0; }
            .carousel-control-prev, .carousel-control-next, .carousel-indicators { display: none !important; }
            .carousel-item img { height: 400px; page-break-inside: avoid; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark no-print">
        <div class="container d-flex justify-content-between align-items-center">
            <button onclick="window.location.href='index.html';" class="btn btn-link text-white text-decoration-none navbar-brand fw-bold p-0 d-flex align-items-center">
                <img src="logo.jpg" alt="الرئيسية" style="height: 50px; border-radius: 8px; margin-left: 10px;"> العودة للرئيسية
            </button>
            <div class="d-flex gap-2">
                <button onclick="shareProperty()" class="btn btn-primary btn-sm fw-bold"><i class="fas fa-share-alt me-1"></i> مشاركة العقار</button>
                <button onclick="window.print()" class="btn btn-light btn-sm fw-bold"><i class="fas fa-print me-1"></i> طباعة</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="details-container" id="propertyDetails">
            <div class="text-center py-5">جاري تحميل البيانات...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPropData = null; 

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const propId = urlParams.get('id');

            if (!propId) {
                document.getElementById('propertyDetails').innerHTML = '<div class="alert alert-danger text-center">عذراً، لم يتم العثور على العقار!</div>'; return;
            }

            const properties = JSON.parse(localStorage.getItem('myProperties')) || [];
            currentPropData = properties.find(p => p.id === Number(propId));

            if (!currentPropData) {
                document.getElementById('propertyDetails').innerHTML = '<div class="alert alert-danger text-center">عذراً، هذا العقار غير موجود!</div>'; return;
            }

            let imagesArray = (Array.isArray(currentPropData.images) && currentPropData.images.length > 0) ? currentPropData.images : (currentPropData.image ? [currentPropData.image] : ['https://placehold.co/800x500/eeeeee/999999?text=لا+توجد+صورة']);
            let indicatorsHTML = ''; let innerHTML = '';
            
            imagesArray.forEach((imgSrc, index) => {
                let activeClass = index === 0 ? 'active' : '';
                indicatorsHTML += `<button type="button" data-bs-target="#propertyCarousel" data-bs-slide-to="${index}" class="${activeClass}"></button>`;
                innerHTML += `<div class="carousel-item ${activeClass}"><img src="${imgSrc}" class="d-block w-100" alt="صورة العقار"></div>`;
            });

            const typeText = currentPropData.type === 'sale' ? 'للبيع' : 'للإيجار';
            const categoryMap = { 'villa': 'فيلا', 'apartment': 'شقة', 'land': 'أرض' };
            const categoryText = categoryMap[currentPropData.category] || currentPropData.category;
            const commissionValue = (Number(currentPropData.price) * 0.025).toLocaleString();

            const detailsHTML = `
                <div class="row">
                    <div class="col-lg-8">
                        <div id="propertyCarousel" class="carousel slide mb-4" data-bs-ride="carousel">
                            <div class="carousel-indicators">${indicatorsHTML}</div>
                            <div class="carousel-inner">${innerHTML}</div>
                            ${imagesArray.length > 1 ? `
                            <button class="carousel-control-prev" type="button" data-bs-target="#propertyCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
                            <button class="carousel-control-next" type="button" data-bs-target="#propertyCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>` : ''}
                        </div>

                        <h2 class="fw-bold mb-3">${currentPropData.title}</h2>
                        <p class="text-muted fs-5"><i class="fas fa-map-marker-alt text-danger me-2"></i> ${currentPropData.city} - حي ${currentPropData.district}</p>
                        
                        <h4 class="fw-bold mt-4 border-bottom pb-2 text-primary">التفاصيل والوصف</h4>
                        <p class="fs-5" style="white-space: pre-wrap; line-height: 1.8;">${currentPropData.description}</p>
                    </div>

                    <div class="col-lg-4">
                        <div class="sticky-top" style="top: 20px;">
                            <div class="text-center mb-4">
                                <div class="price-badge d-inline-block w-100">${Number(currentPropData.price).toLocaleString()} ريال سعودي</div>
                            </div>
                            
                            <div class="info-box"><strong><i class="fas fa-home text-primary me-2"></i> نوع العقار:</strong> ${categoryText}</div>
                            <div class="info-box"><strong><i class="fas fa-tags text-primary me-2"></i> العرض:</strong> ${typeText}</div>
                            <div class="info-box border-success" style="border-right-color: #198754 !important;"><strong><i class="fas fa-hashtag text-success me-2"></i> رقم الإعلان:</strong> ${currentPropData.id}</div>
                            
                            <div class="commission-box my-3">
                                <i class="fas fa-hand-holding-usd me-2"></i> عمولة السعي (2.5%): ${commissionValue} ر.س
                            </div>

                            <a href="https://wa.me/966579876796?text=السلام عليكم، أستفسر عن الإعلان رقم: ${currentPropData.id}%0Aالعنوان: ${currentPropData.title}" class="btn btn-success w-100 btn-lg fw-bold no-print mt-3">
                                <i class="fab fa-whatsapp me-2"></i> تواصل عبر الواتساب
                            </a>
                            <button onclick="shareProperty()" class="btn btn-outline-primary w-100 mt-2 fw-bold no-print">
                                <i class="fas fa-share-alt me-2"></i> مشاركة الإعلان
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('propertyDetails').innerHTML = detailsHTML;
        });

        function shareProperty() {
            if (!currentPropData) return;
            
            const shareTitle = `فرصة عقارية: ${currentPropData.title}`;
            const shareText = `شاهد هذا العقار الرائع في ${currentPropData.city} بسعر ${Number(currentPropData.price).toLocaleString()} ريال.`;
            const shareUrl = window.location.href;

            if (navigator.share) {
                navigator.share({
                    title: shareTitle,
                    text: shareText,
                    url: shareUrl
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(`${shareTitle}\n${shareText}\n${shareUrl}`).then(() => {
                    alert("تم نسخ رابط العقار وتفاصيله، يمكنك لصقه وإرساله لأي شخص!");
                });
            }
        }
    </script>
</body>
</html>
