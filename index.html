<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سالم الغامدي للوساطة العقارية | الرئيسية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f4f6f9; }
        .property-card { border: none; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.08); transition: 0.3s; background: #fff; display: flex; flex-direction: column;}
        .property-card:hover { transform: translateY(-5px); }
        .bg-dark { background-color: #1a1a1a !important; }
        .btn-primary, .bg-primary { background-color: #B68D40 !important; border-color: #B68D40 !important; }
        .price-text { color: #B68D40; font-weight: bold; font-size: 1.2rem; }
        .visitor-counter { background: #1a1a1a; color: #B68D40; padding: 20px 0; text-align: center; border-top: 2px solid #B68D40; }
        .counter-box { background: #262626; padding: 5px 15px; border-radius: 5px; border: 1px solid #B68D40; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <h3 class="fw-bold mb-4 border-bottom pb-2">أحدث العقارات المضافة</h3>
        <div class="row g-4" id="propertiesContainer"></div>
    </div>

    <footer class="visitor-counter">
        <div class="container">
            <p class="mb-0 fw-bold">إجمالي عدد زيارات الموقع</p>
            <div class="counter-box">
                <img src="https://profile-counter.glitch.me/salem-alghamdi-realestate/count.svg" alt="Visitor Counter">
            </div>
            <p class="small text-muted mt-2">رقم رخصة فال: 1100251924</p>
        </div>
    </footer>

    <script>
        const supabaseUrl = 'https://qozdtxrvzyjvoatyizrg.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvemR0eHJ2enlqdm9hdHlpenJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0ODg2NTEsImV4cCI6MjA4NzA2NDY1MX0.TauoT3b3L_ucs7pArG1J3rGmlAs2-b_5AZ2nlIPn18k';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function loadPropertiesFromDB() {
            const { data, error } = await supabaseClient.from('properties').select('*').eq('status', 'approved').order('created_at', { ascending: false });
            if (data) renderProperties(data);
        }

        function renderProperties(properties) {
            const container = document.getElementById('propertiesContainer');
            container.innerHTML = '';
            properties.forEach(prop => {
                container.innerHTML += `
                <div class="col-md-4">
                    <div class="card property-card h-100">
                        <img src="${prop.images[0] || 'logo.jpg'}" class="card-img-top" style="height:200px; object-fit:cover;">
                        <div class="card-body">
                            <h5 class="fw-bold">${prop.title}</h5>
                            <p class="price-text">${Number(prop.price).toLocaleString()} ر.س</p>
                            <button onclick="window.location.href='details.html?id=${prop.id}';" class="btn btn-primary w-100 fw-bold">التفاصيل</button>
                        </div>
                        <div class="card-footer bg-light text-muted small d-flex justify-content-between">
                            <span><i class="fas fa-home"></i> ${prop.category}</span>
                            <span><i class="fas fa-eye"></i> ${prop.views || 0} مشاهدة</span>
                        </div>
                    </div>
                </div>`;
            });
        }
        document.addEventListener('DOMContentLoaded', loadPropertiesFromDB);
    </script>
</body>
</html>
