<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة العقار | الصفحة الرئيسية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f4f6f9; }
        .hero-slider .carousel-item { height: 500px; background-color: #000; }
        .hero-slider img { object-fit: cover; height: 100%; opacity: 0.7; }
        .carousel-caption { bottom: 20%; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 10px; }
        .search-box { background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); margin-top: -80px; position: relative; z-index: 10; }
        .property-card { border: none; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.08); transition: 0.3s; background: #fff; display: flex; flex-direction: column;}
        .property-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .badge-sale { background-color: #dc3545; }
        .badge-rent { background-color: #198754; }
        .card-img-top { height: 220px; object-fit: cover; }
        .price-text { color: #0d6efd; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">بوابة العقار</a>
            <div class="d-flex">
                <a href="admin.html" class="btn btn-outline-warning btn-sm">دخول المسوق (الإدارة)</a>
            </div>
        </div>
    </nav>

    <div id="mainCarousel" class="carousel slide hero-slider" data-bs-ride="carousel">
        <div class="carousel-inner" id="sliderContainer">
            <div class="carousel-item active">
                <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1920&q=80" class="d-block w-100" alt="عقار">
                <div class="carousel-caption d-none d-md-block">
                    <h2>ابحث عن منزلك المثالي</h2>
                    <p>أفضل العروض العقارية الحصرية</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1920&q=80" class="d-block w-100" alt="استثمار">
                <div class="carousel-caption d-none d-md-block">
                    <h2>فرص استثمارية مميزة</h2>
                    <p>أراضي وعمائر بعوائد مجزية</p>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="search-box">
            <form id="filterForm" class="row g-3">
                <div class="col-md-2">
                    <label class="form-label fw-bold">نوع العرض</label>
                    <select class="form-select" id="filterType">
                        <option value="all">الكل</option>
                        <option value="sale">بيع</option>
                        <option value="rent">إيجار</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">نوع العقار</label>
                    <select class="form-select" id="filterCategory">
                        <option value="all">كل العقارات</option>
                        <optgroup label="عقارات سكنية">
                            <option value="فيلا">فيلا</option>
                            <option value="شقة">شقة</option>
                            <option value="دور">دور</option>
                            <option value="ملحق">ملحق</option>
                            <option value="عمارة">عمارة</option>
                            <option value="قصر">قصر</option>
                            <option value="بيت شعبي">بيت شعبي</option>
                        </optgroup>
                        <optgroup label="عقارات تجارية">
                            <option value="محل">محل</option>
                            <option value="مكتب">مكتب</option>
                            <option value="معرض">معرض</option>
                            <option value="مستودع">مستودع</option>
                            <option value="مجمع تجاري">مجمع تجاري</option>
                        </optgroup>
                        <optgroup label="أراضي ومزارع">
                            <option value="أرض سكنية">أرض سكنية</option>
                            <option value="أرض تجارية">أرض تجارية</option>
                            <option value="أرض زراعية">أرض زراعية</option>
                            <option value="مزرعة">مزرعة</option>
                            <option value="استراحة / شاليه">استراحة / شاليه</option>
                        </optgroup>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">المدينة</label>
                    <select class="form-select" id="filterCity" onchange="toggleFilterCustomCity()">
                        <option value="all">كل المدن</option>
                        <option value="الرياض">الرياض</option>
                        <option value="مكة المكرمة">مكة المكرمة</option>
                        <option value="المدينة المنورة">المدينة المنورة</option>
                        <option value="جدة">جدة</option>
                        <option value="الدمام">الدمام</option>
                        <option value="الخبر">الخبر</option>
                        <option value="الظهران">الظهران</option>
                        <option value="الأحساء">الأحساء</option>
                        <option value="القطيف">القطيف</option>
                        <option value="الجبيل">الجبيل</option>
                        <option value="الطائف">الطائف</option>
                        <option value="تبوك">تبوك</option>
                        <option value="بريدة">بريدة</option>
                        <option value="عنيزة">عنيزة</option>
                        <option value="حائل">حائل</option>
                        <option value="أبها">أبها</option>
                        <option value="خميس مشيط">خميس مشيط</option>
                        <option value="جازان">جازان</option>
                        <option value="نجران">نجران</option>
                        <option value="الباحة">الباحة</option>
                        <option value="عرعر">عرعر</option>
                        <option value="سكاكا">سكاكا</option>
                        <option value="ينبع">ينبع</option>
                        <option value="حفر الباطن">حفر الباطن</option>
                        <option value="الخرج">الخرج</option>
                        <option value="other" class="fw-bold text-primary">مدينة أخرى (بحث)...</option>
                    </select>
                    <input type="text" class="form-control mt-2 d-none" id="filterCustomCity" placeholder="اكتب اسم المدينة...">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">الحي / الوصف</label>
                    <input type="text" class="form-control" id="filterText" placeholder="اكتب للبحث...">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">السعر الأعلى</label>
                    <input type="number" class="form-control" id="maxPrice" placeholder="الحد الأقصى">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" onclick="applyFilter()" class="btn btn-primary w-100 fw-bold">بحث</button>
                </div>
            </form>
        </div>
    </div>

    <div class="container py-5">
        <h3 class="fw-bold mb-4 border-bottom pb-2">أحدث العقارات المضافة</h3>
        <div class="row g-4" id="propertiesContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => loadProperties());

        function toggleFilterCustomCity() {
            const citySelect = document.getElementById('filterCity');
            const customInput = document.getElementById('filterCustomCity');
            if (citySelect.value === 'other') { customInput.classList.remove('d-none'); } 
            else { customInput.classList.add('d-none'); customInput.value = ''; }
        }

        function loadProperties(filteredData = null) {
            const container = document.getElementById('propertiesContainer');
            container.innerHTML = '';
            let properties = JSON.parse(localStorage.getItem('myProperties')) || [];
            if (filteredData) properties = filteredData;

            if (properties.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-5"><h5>لا توجد عقارات تطابق بحثك</h5></div>';
                return;
            }

            properties.forEach(prop => {
                const badgeClass = prop.type === 'sale' ? 'badge-sale' : 'badge-rent';
                const typeText = prop.type === 'sale' ? 'بيع' : 'إيجار';
                
                let coverImg = Array.isArray(prop.images) ? prop.images[0] : prop.image;
                
                // توافقية مع الأنواع القديمة في حال وجودها
                const categoryMap = { 'villa': 'فيلا', 'apartment': 'شقة', 'land': 'أرض' };
                const displayCategory = categoryMap[prop.category] || prop.category;

                const cardHTML = `
                <div class="col-md-4 d-flex align-items-stretch">
                    <div class="card property-card w-100">
                        <div class="position-relative">
                            <span class="badge ${badgeClass} position-absolute top-0 start-0 m-3 py-2 px-3">${typeText}</span>
                            <img src="${coverImg}" class="card-img-top" alt="عقار">
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fw-bold">${prop.title}</h5>
                            <p class="text-muted small mb-2"><i class="fas fa-map-marker-alt text-danger"></i> ${prop.city} - ${prop.district}</p>
                            <p class="card-text text-truncate mb-3">${prop.description}</p>
                            
                            <div class="mt-auto border-top pt-3">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="price-text">${Number(prop.price).toLocaleString()} ر.س</span>
                                </div>
                                <a href="details.html?id=${prop.id}" class="btn btn-primary w-100 fw-bold">استعراض التفاصيل <i class="fas fa-arrow-left me-1"></i></a>
                            </div>
                        </div>
                        <div class="card-footer bg-light text-muted small border-top-0">
                            <i class="fas fa-home text-primary"></i> ${displayCategory}
                        </div>
                    </div>
                </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function applyFilter() {
            let properties = JSON.parse(localStorage.getItem('myProperties')) || [];
            const type = document.getElementById('filterType').value;
            const category = document.getElementById('filterCategory').value;
            const text = document.getElementById('filterText').value.toLowerCase();
            const max = document.getElementById('maxPrice').value;
            
            let citySelectValue = document.getElementById('filterCity').value;
            let customCityText = document.getElementById('filterCustomCity').value.trim();

            const filtered = properties.filter(p => {
                let match = true;
                if (type !== 'all' && p.type !== type) match = false;
                if (category !== 'all' && p.category !== category) match = false;
                
                if (citySelectValue === 'other') {
                    if (customCityText && !p.city.includes(customCityText)) match = false;
                } else if (citySelectValue !== 'all') {
                    if (p.city !== citySelectValue) match = false;
                }

                if (text && !p.district.includes(text) && !p.description.includes(text)) match = false;
                if (max && Number(p.price) > Number(max)) match = false;
                return match;
            });
            loadProperties(filtered);
        }
    </script>
</body>
</html>
