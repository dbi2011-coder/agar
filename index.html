<head>

    <style>

        .hero-slider .carousel-item { height: 500px; background-color: #000; }
        .hero-slider img { object-fit: cover; height: 100%; opacity: 0.7; }

        .search-box { background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); margin-top: -80px; position: relative; z-index: 10; }
        .property-card { border: none; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.08); transition: 0.3s; background: #fff; display: flex; flex-direction: column;}

<body>

    <div class="modal fade" id="submitPropertyModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title fw-bold">أرسل عقارك للتسويق</h5>

                <div class="modal-body">
                    <form id="visitorPropertyForm">
                        <div class="row g-3">

                            <div class="col-md-6">

                                <select class="form-select" id="vCategory" required>
                                    <option value="فيلا">فيلا</option><option value="شقة">شقة</option><option value="أرض سكنية">أرض سكنية</option><option value="عمارة">عمارة</option><option value="أخرى">أخرى...</option>

                            </div>
                            <div class="col-md-6">
                                <label class="form-label">المدينة</label>
                                <input type="text" class="form-control" id="vCity" list="saudiCities" required placeholder="اختر أو اكتب المدينة...">
                                <datalist id="saudiCities">
                                    <option value="الرياض"><option value="جدة"><option value="مكة المكرمة"><option value="المدينة المنورة"><option value="الدمام"><option value="الخبر"><option value="الظهران"><option value="الأحساء"><option value="القطيف"><option value="الجبيل"><option value="الطائف"><option value="تبوك"><option value="بريدة"><option value="عنيزة"><option value="الرس"><option value="حائل"><option value="أبها"><option value="خميس مشيط"><option value="جازان"><option value="نجران"><option value="الباحة"><option value="سكاكا"><option value="عرعر"><option value="ينبع"><option value="حفر الباطن"><option value="الخفجي"><option value="الخرج"><option value="المجمعة"><option value="الزلفي"><option value="وادي الدواسر"><option value="بيشة"><option value="النماص"><option value="محايل عسير"><option value="شرورة"><option value="طريف"><option value="رفحاء"><option value="القريات"><option value="أملج"><option value="الوجه"><option value="ضبا"><option value="حقل"><option value="رابغ"><option value="دومة الجندل">
                                </datalist>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">الحي</label>
                                <input type="text" class="form-control" id="vDistrict" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">صور العقار (اختياري)</label>
                                <input type="file" class="form-control" id="vImageInput" accept="image/*" multiple>
                                <div class="form-text">سيتم إرفاق الصور لتتم مراجعتها من قبل الإدارة</div>
                            </div>

                            <hr class="mt-4">
                            <h6 class="fw-bold text-primary"><i class="fas fa-map-marker-alt"></i> إعدادات الموقع</h6>
                            
                            <div class="col-12">
                                <label class="form-label">رابط خرائط جوجل للعقار (اختياري)</label>
                                <input type="url" class="form-control text-start" id="vGoogleMapUrl" dir="ltr" placeholder="https://maps.app.goo.gl/...">
                                <div class="form-text">إذا كان لديك رابط الموقع من جوجل ماب، الصقه هنا لتسهيل الوصول إليه لاحقاً.</div>
                            </div>
                            
                            <div class="col-12 mt-3">
                                <label class="form-label">تحديد موقع العقار على الخريطة التوضيحية (اختياري)</label>
                                <div class="input-group mb-2" dir="ltr">
                                    <input type="text" class="form-control text-end" id="vMapUrlInput" placeholder="الصق الإحداثيات هنا للاستخراج">
                                    <button class="btn btn-secondary fw-bold" type="button" onclick="vExtractLocationFromUrl()"><i class="fas fa-search-location"></i> تحديد</button>
                                </div>
                                <div id="vMapPicker"></div>
                                <div class="form-text mt-1 text-muted" id="vMapStatus">أو اضغط مباشرة على الخريطة لوضع المؤشر.</div>
                            </div>
                            <hr class="mb-2">

                            <div class="col-12">
                                <label class="form-label">الوصف والتفاصيل</label>
                                <textarea class="form-control" id="vDesc" rows="3" required></textarea>
                            </div>
                            <div class="col-12">
                                <button type="submit" id="vSubmitBtn" class="btn btn-success w-100 fw-bold py-2">إرسال الطلب للإدارة</button>
                            </div>
                        </div>
                    </form>

            </div>

    <div id="mainCarousel" class="carousel slide hero-slider" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1920&q=80" class="d-block w-100" alt="عقار">
                <div class="carousel-caption d-none d-md-block"><h2>ابحث عن منزلك المثالي</h2></div>
            </div>
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1920&q=80" class="d-block w-100" alt="استثمار">
                <div class="carousel-caption d-none d-md-block"><h2>فرص استثمارية مميزة</h2></div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="search-box">
            <form id="filterForm" class="row g-3">
                <div class="col-md-2">
                    <label class="form-label fw-bold">نوع العرض</label>
                    <select class="form-select" id="filterType">
                        <option value="all">الكل</option><option value="sale">بيع</option><option value="rent">إيجار</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">نوع العقار</label>
                    <select class="form-select" id="filterCategory">
                        <option value="all">الكل</option>
                        <option value="فيلا">فيلا</option><option value="شقة">شقة</option><option value="دور">دور</option><option value="عمارة">عمارة</option><option value="محل">محل</option><option value="أرض سكنية">أرض سكنية</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">المدينة</label>
                    <select class="form-select" id="filterCity">
                        <option value="all">كل المدن</option>
                        <option value="الرياض">الرياض</option><option value="جدة">جدة</option><option value="مكة المكرمة">مكة المكرمة</option><option value="المدينة المنورة">المدينة المنورة</option><option value="الدمام">الدمام</option><option value="الخبر">الخبر</option><option value="الظهران">الظهران</option><option value="الأحساء">الأحساء</option><option value="القطيف">القطيف</option><option value="الجبيل">الجبيل</option><option value="الطائف">الطائف</option><option value="تبوك">تبوك</option><option value="بريدة">بريدة</option><option value="عنيزة">عنيزة</option><option value="الرس">الرس</option><option value="حائل">حائل</option><option value="أبها">أبها</option><option value="خميس مشيط">خميس مشيط</option><option value="جازان">جازان</option><option value="نجران">نجران</option><option value="الباحة">الباحة</option><option value="سكاكا">سكاكا</option><option value="عرعر">عرعر</option><option value="ينبع">ينبع</option><option value="حفر الباطن">حفر الباطن</option><option value="الخفجي">الخفجي</option><option value="الخرج">الخرج</option><option value="المجمعة">المجمعة</option><option value="الزلفي">الزلفي</option><option value="وادي الدواسر">وادي الدواسر</option><option value="بيشة">بيشة</option><option value="النماص">النماص</option><option value="محايل عسير">محايل عسير</option><option value="شرورة">شرورة</option><option value="طريف">طريف</option><option value="رفحاء">رفحاء</option><option value="القريات">القريات</option><option value="أملج">أملج</option><option value="الوجه">الوجه</option><option value="ضبا">ضبا</option><option value="حقل">حقل</option><option value="رابغ">رابغ</option><option value="دومة الجندل">دومة الجندل</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">بحث</label>
                    <input type="text" class="form-control" id="filterText" placeholder="اكتب حي أو وصف...">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">السعر الأعلى</label>
                    <input type="number" class="form-control" id="maxPrice" placeholder="الحد الأقصى">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" onclick="applyFilter()" class="btn btn-primary w-100 fw-bold">بحث</button>

    <div class="container py-5">
        <h3 class="fw-bold mb-4 border-bottom pb-2">أحدث العقارات المضافة</h3>
        <div class="row g-4" id="propertiesContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const supabaseUrl = 'https://qozdtxrvzyjvoatyizrg.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvemR0eHJ2enlqdm9hdHlpenJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0ODg2NTEsImV4cCI6MjA4NzA2NDY1MX0.TauoT3b3L_ucs7pArG1J3rGmlAs2-b_5AZ2nlIPn18k';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let allPropertiesData = [];
        
        let vMap; let vMarker; let vSelectedLat = null; let vSelectedLng = null;

        document.addEventListener('DOMContentLoaded', () => loadPropertiesFromDB());

        document.getElementById('submitPropertyModal').addEventListener('shown.bs.modal', function () {
            if (!vMap) {
                vMap = L.map('vMapPicker').setView([24.7136, 46.6753], 10);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(vMap);

                vMap.on('click', function(e) {
                    vUpdateMapMarker(e.latlng.lat, e.latlng.lng, "تم تحديد الموقع يدوياً بنجاح.");
                });
            } else {
                vMap.invalidateSize();
            }
        });

        function vExtractLocationFromUrl() {
            const input = document.getElementById('vMapUrlInput').value;
            const regex = /(-?\d{1,2}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/;
            const match = input.match(regex);
            
            if (match) {
                const lat = parseFloat(match[1]);
                const lng = parseFloat(match[2]);
                vUpdateMapMarker(lat, lng, "تم استخراج الموقع بنجاح!");
                document.getElementById('vMapUrlInput').value = ''; 
            } else {
                alert('عذراً، لم نتمكن من العثور على إحداثيات. يرجى كتابة الإحداثيات مباشرة.');
            }
        }

        function vUpdateMapMarker(lat, lng, successMsg) {
            vSelectedLat = lat;
            vSelectedLng = lng;
            if (vMarker) { vMap.removeLayer(vMarker); }
            vMarker = L.marker([vSelectedLat, vSelectedLng]).addTo(vMap);
            vMap.setView([vSelectedLat, vSelectedLng], 15);
            document.getElementById('vMapStatus').innerHTML = `<span class="text-success fw-bold"><i class="fas fa-check-circle"></i> ${successMsg}</span>`;
        }

        let visitorImagesData = [];
        
        document.getElementById('vImageInput').addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            visitorImagesData = [];
            for (let file of files) {
                let dataUrl = await compressImageVisitor(file);
                visitorImagesData.push(dataUrl);
            }
        });

        function compressImageVisitor(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > 800) { height *= 800 / width; width = 800; }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.5)); 
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        document.getElementById('visitorPropertyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('vSubmitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري الإرسال...';

            const pendingProp = {
                id: Date.now(),
                title: document.getElementById('vTitle').value,
                price: document.getElementById('vPrice').value,
                owner_phone: document.getElementById('vPhone').value,
                type: document.getElementById('vType').value,
                category: document.getElementById('vCategory').value,
                city: document.getElementById('vCity').value,
                district: document.getElementById('vDistrict').value,
                description: document.getElementById('vDesc').value,
                images: visitorImagesData,
                lat: vSelectedLat, 
                lng: vSelectedLng, 
                google_map_url: document.getElementById('vGoogleMapUrl').value,
                status: 'pending' 
            };

            const { data, error } = await supabaseClient.from('properties').insert([pendingProp]);

            submitBtn.disabled = false;
            submitBtn.textContent = 'إرسال الطلب للإدارة';

            if (error) {
                alert("حدث خطأ أثناء الإرسال، حاول مرة أخرى.");
                console.error(error);
            } else {
                alert("تم استلام طلبك بنجاح! سيقوم فريقنا بمراجعته والتواصل معك قريباً.");
                document.getElementById('visitorPropertyForm').reset();
                document.getElementById('vMapUrlInput').value = '';
                document.getElementById('vGoogleMapUrl').value = '';
                
                vSelectedLat = null; vSelectedLng = null;
                if(vMarker && vMap) vMap.removeLayer(vMarker);
                document.getElementById('vMapStatus').innerHTML = `أو اضغط مباشرة على الخريطة لوضع المؤشر.`;
                if(vMap) vMap.setView([24.7136, 46.6753], 10);

                var modal = bootstrap.Modal.getInstance(document.getElementById('submitPropertyModal'));
                modal.hide();
            }
        });

        async function loadPropertiesFromDB() {
            const container = document.getElementById('propertiesContainer');
            container.innerHTML = '<div class="col-12 text-center text-muted py-5"><h5>جاري تحميل العقارات...</h5></div>';
            
            const { data, error } = await supabaseClient.from('properties').select('*').eq('status', 'approved').order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = '<div class="col-12 text-center text-danger py-5"><h5>حدث خطأ في جلب البيانات</h5></div>'; return;
            }

            allPropertiesData = data || [];
            renderProperties(allPropertiesData);
        }

        function renderProperties(properties) {
            const container = document.getElementById('propertiesContainer');
            container.innerHTML = '';

            if (properties.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-5"><h5>لا توجد عقارات مطابقة للبحث</h5></div>'; return;
            }

            properties.forEach(prop => {
                const badgeClass = prop.type === 'sale' ? 'badge-sale' : 'badge-rent';
                const typeText = prop.type === 'sale' ? 'بيع' : 'إيجار';
                let coverImg = (Array.isArray(prop.images) && prop.images.length > 0) ? prop.images[0] : 'logo.jpg';
                const categoryMap = { 'villa': 'فيلا', 'apartment': 'شقة', 'land': 'أرض' };
                const displayCategory = categoryMap[prop.category] || prop.category;

                const cardHTML = `
                <div class="col-md-4 d-flex align-items-stretch">
                    <div class="card property-card w-100">
                        <div class="position-relative">
                            <span class="badge ${badgeClass} position-absolute top-0 start-0 m-3 py-2 px-3">${typeText}</span>
                            <img src="${coverImg}" class="card-img-top" alt="عقار">
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fw-bold">${prop.title}</h5>
                            <p class="text-muted small mb-2"><i class="fas fa-map-marker-alt text-danger"></i> ${prop.city} - ${prop.district}</p>
                            <p class="card-text text-truncate mb-3">${prop.description}</p>
                            
                            <div class="mt-auto border-top pt-3">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="price-text">${Number(prop.price).toLocaleString()} ر.س</span>
                                </div>
                                <button onclick="window.location.href='details.html?id=${prop.id}';" class="btn btn-primary w-100 fw-bold">استعراض التفاصيل <i class="fas fa-arrow-left me-1"></i></button>
                            </div>
                        </div>
                        <div class="card-footer bg-light text-muted small border-top-0">
                            <i class="fas fa-home text-primary"></i> ${displayCategory}
                        </div>
                    </div>
                </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function applyFilter() {
            const type = document.getElementById('filterType').value;
            const category = document.getElementById('filterCategory').value;
            const text = document.getElementById('filterText').value.toLowerCase();
            const max = document.getElementById('maxPrice').value;
            let citySelectValue = document.getElementById('filterCity').value;

            const filtered = allPropertiesData.filter(p => {
                let match = true;
                if (type !== 'all' && p.type !== type) match = false;
                if (category !== 'all' && p.category !== category) match = false;
                if (citySelectValue !== 'all' && p.city !== citySelectValue) match = false;
                if (text && !p.district.includes(text) && !p.description.includes(text)) match = false;
                if (max && Number(p.price) > Number(max)) match = false;
                return match;
            });
            renderProperties(filtered);
        }
    </script>
</body>
</html>
